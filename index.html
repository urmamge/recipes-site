<title>Mum's Recipe Book</title>
<meta name="theme-color" content="#3B6C45">

<style>
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
.card-photo { margin-top: 28px; }
.card-photo a { display: block; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.card-photo img { display: block; width: 100%; height: auto; }
.card-photo .hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.unlock { max-width: 440px; margin: 40px auto 0; }
.unlock .box { gap: 14px; }
.unlock input { font-size: 20px; letter-spacing: .06em; }

<style>
/* Layout: a greenhouse notebook. Leafy header, a wrapping grid of recipe cards, and a two-column recipe page (ingredients pinned beside the method). */
:root {
  --bg: #F1F4EC;
  --surface: #FBFCF8;
  --ink: #1D2D21;
  --muted: #5B6B5D;
  --line: #D3DCCD;
  --leaf: #3B6C45;
  --leaf-ink: #FFFFFF;
  --leaf-soft: #DFE9D9;
  --leaf-deep: #2A4F33;
  --bloom: #B7801A;
  --paper: #FFFBEF;
  --paper-line: #E9DFC4;
  --pencil: #3B3A6B;
  --danger: #A33A2E;
  --shadow: 0 1px 2px rgba(29,45,33,.06), 0 6px 18px rgba(29,45,33,.07);
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131A15; --surface: #1A231D; --ink: #E3EBE1; --muted: #9DAE9F; --line: #2E3B31;
    --leaf: #7DB68A; --leaf-ink: #0F1A12; --leaf-soft: #233328; --leaf-deep: #A9D3B3; --bloom: #E2B65A;
    --paper: #24261C; --paper-line: #3A3B2C; --pencil: #C7C3F2; --danger: #E58374;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131A15; --surface: #1A231D; --ink: #E3EBE1; --muted: #9DAE9F; --line: #2E3B31;
  --leaf: #7DB68A; --leaf-ink: #0F1A12; --leaf-soft: #233328; --leaf-deep: #A9D3B3; --bloom: #E2B65A;
  --paper: #24261C; --paper-line: #3A3B2C; --pencil: #C7C3F2; --danger: #E58374;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 56px;
}
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--leaf); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); background: var(--surface);
  padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 15px;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { border-color: var(--leaf); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--leaf); color: var(--leaf-ink); border-color: var(--leaf); }
.btn.primary:hover { background: var(--leaf-deep); border-color: var(--leaf-deep); color: var(--bg); }
.btn.ghost { background: transparent; border-color: transparent; padding-inline: 10px; }
.btn.ghost:hover { background: var(--leaf-soft); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn[disabled] { opacity: .55; cursor: default; }
a.btn { color: inherit; text-decoration: none; }
.btn svg { width: 18px; height: 18px; flex: none; }

/* Header */
.masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: flex-end; gap: 14px; min-width: 0; }
.brand svg { width: 46px; height: 76px; color: var(--leaf); flex: none; }
.brand h1 { font-size: clamp(34px, 6vw, 54px); line-height: 1; letter-spacing: -.01em; }
.brand p { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
.brand p .hand { font-family: var(--f-hand); font-size: 22px; color: var(--leaf); line-height: 1; }

/* Toolbar */
.toolbar { display: flex; flex-direction: column; gap: 14px; padding-block: 22px 18px; }
.search { position: relative; max-width: 520px; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
.search input {
  width: 100%; padding: 12px 14px 12px 42px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface);
}
.search input:focus { outline: none; border-color: var(--leaf); box-shadow: 0 0 0 3px var(--leaf-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 6px 13px; font-size: 14px; font-weight: 500; color: var(--muted);
}
.chip:hover { color: var(--ink); border-color: var(--leaf); }
.chip[aria-pressed="true"] { background: var(--leaf-soft); color: var(--leaf-deep); border-color: var(--leaf); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 4px; }

/* Grid of cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
.card {
  display: flex; flex-direction: column; text-align: left; padding: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  overflow: hidden; box-shadow: var(--shadow); transition: transform .15s, border-color .15s;
}
.card:hover { transform: translateY(-2px); border-color: var(--leaf); }
.thumb { aspect-ratio: 4 / 3; width: 100%; max-width: 100%; background: var(--leaf-soft); position: relative; overflow: hidden; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--leaf); }
.thumb .ph svg { width: 34%; height: 80%; opacity: .5; }
.thumb .ph span { position: absolute; font-family: var(--f-display); font-size: 54px; color: var(--leaf-deep); opacity: .85; }
.fav-badge { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--bloom); box-shadow: var(--shadow); }
.fav-badge svg { width: 16px; height: 16px; }
.card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--leaf); }
.card h3 { font-size: 21px; line-height: 1.2; }
.meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin-top: auto; padding-top: 4px; font-variant-numeric: tabular-nums; }
.meta span { display: inline-flex; align-items: center; gap: 5px; }
.meta svg { width: 15px; height: 15px; }
.example-tag { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 1px 6px; align-self: flex-start; }

/* Empty + notices */
.empty { text-align: center; padding: 56px 16px; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 14px; }
.empty svg.big { width: 70px; height: 110px; color: var(--leaf); }
.empty h2 { font-size: 28px; }
.empty p { color: var(--muted); margin: 0; }
.notice { background: var(--paper); border: 1px solid var(--paper-line); border-radius: 12px; padding: 12px 16px; margin-top: 16px; font-size: 15px; }
.notice[hidden] { display: none; }

/* Recipe page */
.back { margin: 18px 0 8px -10px; }
.recipe-head { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-block: 8px 28px; border-bottom: 1px solid var(--line); }
.recipe-head .thumb { border-radius: 16px; aspect-ratio: 4 / 3; }
.recipe-head .thumb .ph span { font-size: 96px; }
.recipe-title { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.recipe-title h2 { font-size: clamp(32px, 5vw, 48px); line-height: 1.08; }
.recipe-title .meta { font-size: 15px; margin-top: 0; }
.recipe-title .source { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.recipe-title .source a { color: var(--leaf); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 6px; }
.btn.fav-on { color: var(--bloom); border-color: var(--bloom); }

.recipe-body { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 40px; padding-top: 28px; }
.panel-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.panel-title h3 { font-size: 24px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.stepper button { border: 0; background: transparent; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; line-height: 1; }
.stepper button:hover { background: var(--leaf-soft); }
.stepper output { min-width: 78px; text-align: center; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ingredients { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.ing-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ing-list li { border-bottom: 1px dashed var(--line); }
.ing-list li:last-child { border-bottom: 0; }
.ing-list label { display: flex; gap: 12px; align-items: flex-start; padding: 9px 0; cursor: pointer; }
.ing-list input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--leaf); flex: none; }
.ing-list input:checked + span { text-decoration: line-through; color: var(--muted); }
.ing-list strong { font-weight: 700; font-variant-numeric: tabular-nums; }
.scaled-note { font-size: 13px; color: var(--muted); margin: 12px 0 0; }

.steps { list-style: none; counter-reset: step; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.steps li { counter-increment: step; }
.steps button {
  width: 100%; text-align: left; border: 0; background: transparent; border-radius: 12px;
  display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; padding: 14px 12px; font-size: 17px; line-height: 1.6;
}
.steps button::before {
  content: counter(step); font-family: var(--f-display); font-size: 20px; color: var(--leaf);
  width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--leaf); display: grid; place-items: center; line-height: 1;
}
.steps button:hover { background: var(--leaf-soft); }
.steps li.done button { color: var(--muted); }
.steps li.done button::before { content: "✓"; background: var(--leaf); color: var(--leaf-ink); }
.steps-hint { font-size: 13px; color: var(--muted); margin: -6px 0 10px; }

.notes-card {
  margin-top: 28px; background: var(--paper); border: 1px solid var(--paper-line); border-radius: 4px 14px 14px 4px;
  padding: 16px 22px 18px; position: relative;
  background-image: repeating-linear-gradient(to bottom, transparent 0 33px, var(--paper-line) 33px 34px);
  background-position: 0 46px;
}
.notes-card h4 { margin: 0 0 4px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.notes-card p { font-family: var(--f-hand); font-size: 25px; line-height: 34px; color: var(--pencil); margin: 0; white-space: pre-wrap; }

/* Add / edit */
.sheet { max-width: 760px; margin: 0 auto; padding-top: 12px; }
.sheet > h2 { font-size: clamp(30px, 5vw, 40px); margin-bottom: 6px; }
.sheet > p.lede { color: var(--muted); margin: 0 0 24px; }
.ways { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
.way {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px;
  display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); transition: border-color .15s, transform .15s;
}
.way:hover { border-color: var(--leaf); transform: translateY(-2px); }
.way .ico { width: 44px; height: 44px; border-radius: 12px; background: var(--leaf-soft); color: var(--leaf-deep); display: grid; place-items: center; }
.way .ico svg { width: 24px; height: 24px; }
.way strong { font-size: 18px; font-family: var(--f-display); font-weight: 400; }
.way span { color: var(--muted); font-size: 14px; }
.way .tag { font-size: 12px; font-weight: 600; color: var(--leaf); }

.box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .lbl { font-weight: 600; font-size: 14px; }
.field .hint { font-size: 13px; color: var(--muted); font-weight: 400; }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 16px;
}
.field textarea { resize: vertical; line-height: 1.55; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--leaf); box-shadow: 0 0 0 3px var(--leaf-soft); }
.row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.form-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; align-items: center; }
.form-actions .msg { margin-right: auto; font-size: 14px; color: var(--muted); }
.form-actions .msg.err { color: var(--danger); }
.photo-pick { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.photo-pick img { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.drop {
  border: 2px dashed var(--line); border-radius: 14px; padding: 28px 18px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--bg);
}
.drop.over { border-color: var(--leaf); background: var(--leaf-soft); }
.drop img { max-height: 260px; max-width: 100%; border-radius: 10px; }
.reading { display: flex; align-items: center; gap: 10px; color: var(--leaf-deep); font-weight: 600; }
.spinner { width: 20px; height: 20px; border: 2.5px solid var(--leaf-soft); border-top-color: var(--leaf); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.check { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.check input { width: 18px; height: 18px; accent-color: var(--leaf); }

/* Variations, parts and sauces on the recipe page */
.pickers { display: flex; flex-direction: column; gap: 12px; padding-top: 22px; }
.picker { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.picker-label { font-weight: 600; font-size: 14px; min-width: 84px; }
.part-head { font-family: var(--f-body); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--leaf); margin: 18px 0 2px; }
.ingredients .part-head:first-of-type { margin-top: 0; }
.jump { border: 0; background: none; padding: 0; color: var(--leaf); font-size: 14px; text-decoration: underline; text-underline-offset: 2px; }
.sub-recipe { margin-top: 32px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); padding: 22px; scroll-margin-top: 16px; }
.sub-recipe .sub-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.sub-recipe .sub-head > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sub-recipe h3 { font-size: 28px; }
.sub-recipe .recipe-body { padding-top: 0; }
.sub-recipe .ingredients { position: static; background: var(--bg); }
.uses-note { margin: 0; color: var(--muted); font-size: 14px; }

/* Form: parts, variations and extras */
.ed-all { display: flex; flex-direction: column; gap: 14px; }
.ed-sec { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--bg); }
.ed-sec .field input, .ed-sec .field select, .ed-sec .field textarea { background: var(--surface); }
.ed-sub-opt { display: flex; flex-direction: column; gap: 12px; }
.ed-sub-opt + .ed-sub-opt { border-top: 1px dashed var(--line); padding-top: 12px; }
.ed-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ed-actions .hint { font-size: 13px; color: var(--muted); }
.ed-group-head { padding-top: 8px; border-top: 1px solid var(--line); }
.ed-group-head h3 { font-size: 22px; padding-top: 14px; }
.ed-group-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.btn.small { padding: 6px 13px; font-size: 14px; }

/* Footer */
footer { margin-top: 64px; padding-top: 22px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; justify-content: space-between; color: var(--muted); font-size: 14px; }
footer .tunes { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
footer .tunes b { font-weight: 600; color: var(--ink); }
footer a { color: var(--leaf); text-decoration: none; border-bottom: 1px solid var(--leaf-soft); }
footer a:hover { border-bottom-color: var(--leaf); }

@media (max-width: 760px) {
  .recipe-head, .recipe-body { grid-template-columns: minmax(0, 1fr); gap: 22px; }
  .ingredients { position: static; }
  .row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .row .field:first-child { grid-column: 1 / -1; }
  .brand svg { width: 34px; height: 56px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation-duration: 0s !important; }
}
</style>
</head>

const UNIT_RE = /^(kg|kilograms?|g|grams?|grammes?|mg|ml|millilitres?|milliliters?|cl|l|litres?|liters?|oz|ounces?|lbs?|pounds?|tbsps?|tablespoons?|tbs|tsps?|teaspoons?|cups?|pints?|pinch(es)?|handfuls?|cloves?|slices?|rashers?|cans?|tins?|knobs?|sticks?|bunch(es)?|sprigs?|fillets?|breasts?|thighs?)\b\.?/i;

function gramsFor(s, food) {

function ingredientInfo(line) {
  const s = line.toLowerCase().replace(/\([^)]*\)/g, " ").replace(/\s+/g, " ").trim();
  const food = FOODS.find(f => f.re.test(s));
  if (!food) return null;

  if (g == null) return food.kcal ? null : { kcal: 0, g: 0 };

  const frying = food.kcal === 884 && (g > 200 || /for (deep[- ]?|shallow[- ]?)?frying/.test(s));
  return { kcal: g * food.kcal / 100 * (frying ? .15 : 1), g };

/* ---------- recipes made of sections ----------
   A recipe is one or more sections. A "part" section holds its own ingredients and method
   (the chicken, the potatoes); a "sub" section points at another recipe in the book (a sauce,
   a spice rub) shown in its own box. Any section can have several options to pick between.
   Simple recipes store no sections: their top-level lists are the one section. */
function sectionsOf(r) {
  if (Array.isArray(r.sections) && r.sections.length) return r.sections;
  return [{ id: "main", kind: "part", name: "", options: [{ id: "o", name: "", ingredients: r.ingredients || [], steps: r.steps || [] }] }];
}
const findRecipe = (id) => recipes.find(x => x.id === id);

function waysCount(r) { return sectionsOf(r).reduce((n, s) => n * Math.max(1, s.options.length), 1); }
function optionLabel(sec, opt, i) {
  if (sec.kind === "sub") return findRecipe(opt.recipeId)?.title || "Missing recipe";
  return opt.name || `Version ${i + 1}`;
}
// Which option is picked in each section, remembered on this device.
function choiceFor(r) {
  let saved = {};
  try { saved = JSON.parse(store.get("choice:" + r.id) || "{}"); } catch {}
  const c = {};
  for (const s of sectionsOf(r)) { const i = saved[s.id]; c[s.id] = Number.isInteger(i) && i < s.options.length ? i : 0; }
  return c;
}
function chosen(r, choice) {
  return sectionsOf(r).map(sec => ({ sec, opt: sec.options[choice?.[sec.id] ?? 0] || sec.options[0] })).filter(x => x.opt);
}

// How much of a sauce/extra the dish uses, as a share of the batch: "all", "half", "2 tbsp", "100ml".
const GENERIC = { kcal: 100, each: 0, d: 1 };
function usesFraction(uses, batch) {
  const s = String(uses || "").toLowerCase().trim();
  if (!s || /^(all|the lot|everything|the whole|whole|one batch|1 batch)/.test(s)) return 1;
  const words = [["three quarters", .75], ["two thirds", 2 / 3], ["half", .5], ["third", 1 / 3], ["quarter", .25]];
  for (const [w, v] of words) if (s.includes(w)) return v;
  const b = s.match(/^(\d+(?:\.\d+)?)\s*batch/);
  if (b) return Math.min(+b[1], 4);
  const p = parseQty(s);
  if (p && !s.slice(p[1].length).trim()) return Math.min(p[0], 4);
  const g = gramsFor(s, GENERIC);
  return g && batch?.g ? Math.min(g / batch.g, 4) : null;
}

function linesTotals(lines) {
  const t = { kcal: 0, g: 0, unknown: 0, n: lines.length };
  for (const l of lines) { const i = ingredientInfo(l); if (!i) t.unknown++; else { t.kcal += i.kcal; t.g += i.g; } }
  return t;
}
// Calories and weight of the dish for the picked options; sauces and extras count for the share used.
function dishTotals(r, choice, depth = 0) {
  if (depth > 0 && r.calories) return { kcal: r.calories * (r.serves || 1), g: 0, unknown: 0, n: 1 };
  const t = { kcal: 0, g: 0, unknown: 0, n: 0 };
  for (const { sec, opt } of chosen(r, choice)) {
    if (sec.kind === "sub") {
      if (depth > 0) continue;
      t.n++;
      const sr = findRecipe(opt.recipeId);
      const st = sr && dishTotals(sr, choiceFor(sr), 1);
      const share = st && !(st.unknown > st.n / 3) && st.kcal ? usesFraction(opt.uses, st) : null;
      if (share == null) { t.unknown++; continue; }
      t.kcal += st.kcal * share; t.g += st.g * share;
    } else {
      const lt = linesTotals(opt.ingredients || []);
      t.kcal += lt.kcal; t.g += lt.g; t.unknown += lt.unknown; t.n += lt.n;
    }
  }
  return t;
}
function calorieInfo(r, choice) {
  if (r.calories) return { value: r.calories, estimated: false };
  const t = dishTotals(r, choice || choiceFor(r));
  // Only estimate when most of the list could be counted.
  if (!t.n || !t.kcal || t.unknown > t.n / 3) return null;
  const value = Math.round(t.kcal / (r.serves || 1) / 10) * 10;
  return value ? { value, estimated: true } : null;
}

// Everything a search should find, every variation and sauce included.
function searchText(r) {
  const bits = [r.title, r.category, r.notes];
  for (const s of sectionsOf(r)) {
    bits.push(s.name);
    for (const o of s.options) bits.push(o.name, ...(o.ingredients || []), s.kind === "sub" ? findRecipe(o.recipeId)?.title : "");
  }
  return bits.filter(Boolean).join(" ").toLowerCase();
}
function usedIn(id) {
  return recipes.filter(x => x.id !== id && (x.sections || []).some(s => s.kind === "sub" && s.options.some(o => o.recipeId === id)));
}

/* ---------- reading a pasted recipe ---------- */
function parsePasted(raw) {
  const isIng = s => /^(ingredients?|you('|’)?ll need|you will need|what you need)\s*:?$/i.test(s);
  const isMethod = s => /^(method|directions?|instructions?|steps|preparation|how to make( it)?)\s*:?$/i.test(s);
  const isNotes = s => /^(notes?|tips?|cook'?s notes?)\s*:?$/i.test(s);
  const bullet = s => s.replace(/^\s*([-*•·▢□☐✓]|\d+[.)]|step\s*\d+\s*[:.)-]?)\s*/i, "").trim();
  let title = "", serves = "", time = "", mode = "head";
  const ing = [], steps = [], notes = [];
  for (let line of raw.split(/\r?\n/)) {
    line = line.replace(/ /g, " ").trim();
    if (!line) continue;
    if (isIng(line)) { mode = "ing"; continue; }
    if (isMethod(line)) { mode = "steps"; continue; }
    if (isNotes(line)) { mode = "notes"; continue; }
    const sv = line.match(/\b(serves|servings|makes|feeds|yield)\s*:?\s*(\d+)/i);
    if (sv && !serves && line.length < 40) { serves = +sv[2]; if (mode === "head") continue; }
    const tm = line.match(/\b(total time|cook time|cooking time|ready in|takes)\s*:?\s*(.+)/i);
    if (tm && !time && line.length < 50) { time = tm[2]; if (mode === "head") continue; }
    if (mode === "head") { if (!title && line.length < 120) title = line; else notes.push(line); }
    else if (mode === "ing") ing.push(bullet(line));
    else if (mode === "steps") steps.push(bullet(line));
    else notes.push(line);
  }
  // No headings in the paste: lines that start with an amount are ingredients, long sentences are steps.
  if (!ing.length && !steps.length) {
    const rest = notes.splice(0);
    for (const l of rest) {
      const b = bullet(l);
      if (parseQty(b) && b.length < 90) ing.push(b);
      else if (b.length > 45) steps.push(b);
      else notes.push(b);
    }
  }
  return { title, category: "Dinner", serves, time, ingredients: ing.filter(Boolean), steps: steps.filter(Boolean), notes: notes.join("\n"), source: "" };
}

/* ---------- routing (so the back button and shared links work) ---------- */
const NEEDS_KEY = ["add", "new", "edit"];
function nav(hash) {
  if (!hash) { history.pushState("", "", location.pathname + location.search); route(); }
  else if (location.hash === hash) route();
  else location.hash = hash;
}
function route() {
  const hsh = location.hash.slice(1);
  const [view, id] = hsh.startsWith("r-") ? ["recipe", hsh.slice(2)] : hsh.startsWith("edit-") ? ["edit", hsh.slice(5)] : hsh === "new" ? ["new", null] : hsh === "add" ? ["add", null] : ["list", null];
  if (view !== "recipe") releaseWake();
  if (NEEDS_KEY.includes(view) && !key) { ui.after = location.hash; ui.view = "unlock"; render(); window.scrollTo(0, 0); return; }
  if (view === "recipe" && ui.openId !== id) {
    const r = recipes.find(x => x.id === id);
    ui = { ...ui, openId: id, serves: r?.serves || null, choice: null, done: new Set(), ticked: new Set() };
  }
  ui.view = view;
  ui.editId = view === "edit" ? id : null;
  render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
function requireKey(fn) { if (key) fn(); else { ui.after = location.hash; ui.view = "unlock"; render(); window.scrollTo(0, 0); } }

/* ---------- views ---------- */

function partTitle(sec, opt) {

function ingredientList(lines, factor, keyBase) {
  const ul = h("ul", { class: "ing-list" });
  lines.forEach((line, i) => {
    const k = keyBase + ":" + i;
    const { qty, rest } = splitIngredient(line, factor);

    cb.onchange = () => cb.checked ? ui.ticked.add(k) : ui.ticked.delete(k);
    ul.append(h("li", {}, h("label", {}, cb, h("span", {}, qty ? h("strong", {}, qty) : null, rest))));
  });
  return ul;
}

function stepList(steps, keyBase) {
  const ol = h("ol", { class: "steps" });
  steps.forEach((s, i) => {
    const k = keyBase + ":" + i;
    const li = h("li", { class: ui.done.has(k) ? "done" : "" });
    li.append(h("button", { type: "button", "aria-pressed": String(ui.done.has(k)), onclick: () => {
      ui.done.has(k) ? ui.done.delete(k) : ui.done.add(k);
      li.classList.toggle("done"); li.firstChild.setAttribute("aria-pressed", String(ui.done.has(k)));
    } }, h("span", {}, s)));
    ol.append(li);

// A sauce or extra: its own recipe from the book, in its own box on this page.
function subRecipeBox(sec, opt, factor) {
  const sr = findRecipe(opt.recipeId);
  const box = h("section", { class: "sub-recipe", id: "sub-" + sec.id });
  if (!sr) {
    box.append(h("p", { style: "margin:0;color:var(--muted)" }, `The ${sec.name || "extra"} recipe that was here has been deleted. Edit this recipe to choose another.`));
    return box;
  }
  const share = usesFraction(opt.uses, dishTotals(sr, choiceFor(sr), 1));
  // Scale the batch with the servings only when the dish uses all of it.
  const f = share === 1 ? factor : 1;
  const ownChoice = choiceFor(sr);
  const own = chosen(sr, ownChoice).filter(x => x.sec.kind !== "sub");
  box.append(h("div", { class: "sub-head" },
    h("div", {},
      h("span", { class: "eyebrow" }, [sec.name || "Also on this page", sec.first ? "Make this first" : ""].filter(Boolean).join(" · ")),
      h("h3", {}, sr.title),
      h("p", { class: "uses-note" }, share === 1 ? "This dish uses all of it." : opt.uses ? `This dish uses ${opt.uses} of it. The amounts below make the whole batch.` : "")),
    h("a", { class: "btn", href: "#r-" + sr.id }, "Open on its own")));
  const ing = h("aside", { class: "ingredients" }, h("div", { class: "panel-title" }, h("h3", {}, "Ingredients")));
  const method = h("section", {}, h("div", { class: "panel-title" }, h("h3", {}, "Method")));
  for (const { sec: s2, opt: o2 } of own) {
    if (own.length > 1) ing.append(h("h4", { class: "part-head" }, partTitle(s2, o2)));
    ing.append(ingredientList(o2.ingredients || [], f, `sub:${sr.id}:${s2.id}:${o2.id}`));
    if ((o2.steps || []).length) {
      if (own.length > 1) method.append(h("h4", { class: "part-head" }, partTitle(s2, o2)));
      method.append(stepList(o2.steps, `sub:${sr.id}:${s2.id}:${o2.id}`));
    }
  }
  if (waysCount(sr) > 1) method.append(h("p", { class: "scaled-note" }, "This recipe has other versions. Open it on its own to see them."));
  if (sr.notes) method.append(h("div", { class: "notes-card" }, h("h4", {}, "Notes"), h("p", {}, sr.notes)));
  box.append(h("div", { class: "recipe-body" }, ing, method));
  return box;
}

  } catch { say("This device won't keep the screen on from here. Your phone's display settings can do it instead."); }

}

/* ---------- adding ---------- */
function blank() { return { title: "", category: "Dinner", serves: "", time: "", ingredients: [], steps: [], notes: "", source: "" }; }

function renderAdd() {
  const wrap = h("div", { class: "sheet" });
  wrap.append(h("button", { class: "btn ghost back", type: "button", onclick: () => nav("") }, icon("i-back"), "Back"),
    h("h2", {}, "Add a recipe"),
    h("p", { class: "lede" }, "Pick whichever is easiest. You can check and change everything before it's saved."));

  const cardIn = h("input", { id: "cardIn", type: "file", accept: "image/*", class: "sr" });
  cardIn.onchange = () => {
    const f = cardIn.files[0];
    if (!f) return;
    draft = { ...blank(), category: "Other", _cardFile: f };
    nav("#new");
  };
  wrap.append(cardIn, h("div", { class: "ways" },
    h("button", { class: "way", type: "button", onclick: () => renderPasteStep(wrap) },
      h("span", { class: "ico" }, icon("i-paste")), h("strong", {}, "Paste a link or text"),
      h("span", {}, "Copy the web address of a recipe page, or the recipe itself from an email or message, and paste it in."),
      h("span", { class: "tag" }, "Quickest for websites")),
    h("label", { class: "way", for: "cardIn", tabindex: "0", onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); cardIn.click(); } } },
      h("span", { class: "ico" }, icon("i-camera")), h("strong", {}, "Snap the recipe card"),
      h("span", {}, "Take a photo of a recipe card or cookbook page. The photo is kept with the recipe, so you only need to type its name.")),
    h("button", { class: "way", type: "button", onclick: () => { draft = blank(); nav("#new"); } },
      h("span", { class: "ico" }, icon("i-pen")), h("strong", {}, "Write it out"),
      h("span", {}, "Type it in yourself, one ingredient per line."))));
  app.append(wrap);
}

function renderPasteStep(wrap) {
  wrap.replaceChildren(
    h("button", { class: "btn ghost back", type: "button", onclick: () => render() }, icon("i-back"), "Back"),
    h("h2", {}, "Paste a link or text"),
    h("p", { class: "lede" }, "A link to a recipe website works best: the ingredients, method and photo come across on their own. Pasted text works too, and you can tidy it up on the next screen."));
  const ta = h("textarea", { id: "pasteIn", rows: "10", placeholder: "https://www.bbcgoodfood.com/recipes/…\n\nor paste the recipe text here" });
  const status = h("span", { class: "msg" });
  const go2 = h("button", { class: "btn primary", type: "button" }, "Next");
  wrap.append(h("div", { class: "box" }, h("div", { class: "field" }, h("label", { for: "pasteIn" }, "Link or recipe text"), ta), h("div", { class: "form-actions" }, status, go2)));
  ta.focus();
  go2.onclick = async () => {
    const text = ta.value.trim();
    if (!text) { status.className = "msg err"; status.textContent = "Paste a link or a recipe into the box first."; return; }
    const link = text.match(/^https?:\/\/\S+$/i);
    if (!link) { draft = parsePasted(text); nav("#new"); return; }
    go2.disabled = true; status.className = "msg"; status.replaceChildren(h("span", { class: "reading" }, h("span", { class: "spinner" }), "Fetching the recipe…"));
    try {
      const { recipe } = await api("/api/import", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ url: link[0] }) });
      draft = recipe; nav("#new");
    } catch (e) {
      go2.disabled = false; status.className = "msg err";
      status.textContent = e.code === "wrong_key" ? "The kitchen code needs entering again." :
        e.code === "no_recipe" ? "That page doesn't have a recipe this can read. Copy the recipe text from the page and paste that instead." :
        "Couldn't open that link. Check it's right, or paste the recipe text instead.";
      if (e.code === "wrong_key") requireKey(() => {});
    }
  };
}

/* ---------- the form (new + edit) ---------- */
// The form edits a copy of the recipe's sections, with lists kept as text for the boxes.
function toEditable(r) {
  const keep = (id, placeholder) => id && id !== placeholder ? id : uid();
  const joined = (v) => Array.isArray(v) ? v.join("\n") : (v || "");
  // Imported recipes can arrive with a sauce or spice mix to create ("recipeId: new").
  return sectionsOf(r).map(s => ({
    id: keep(s.id, "main"), kind: s.kind === "sub" ? "sub" : "part", name: s.name || "", first: !!s.first, active: 0,
    options: s.options.map(o => s.kind === "sub"
      ? { id: keep(o.id), recipeId: o.recipeId || "", uses: o.uses || "", newTitle: o.newTitle || "", newIng: joined(o.newIngredients || o.newIng), newSteps: joined(o.newSteps) }
      : { id: keep(o.id, "o"), name: o.name || "", ing: joined(o.ingredients), steps: joined(o.steps) }),
  }));
}
const toLines = (t) => String(t || "").split("\n").map(s => s.trim()).filter(Boolean);

function renderForm() {
  const editing = ui.editId ? findRecipe(ui.editId) : null;
  if (ui.view === "edit" && !editing) { nav(""); return; }
  const d = editing ? { ...editing, ...(draft?._for === editing.id ? draft : {}) } : (draft || blank());
  const isNew = !editing;
  const ed = d._ed || toEditable(d);

  const wrap = h("div", { class: "sheet" });
  wrap.append(h("button", { class: "btn ghost back", type: "button", onclick: () => history.back() }, icon("i-back"), "Back"),
    h("h2", {}, editing ? "Edit recipe" : "Check and save"),
    h("p", { class: "lede" }, editing ? "Change anything, then save." : (d.title ? "Check it looks right, fix anything that doesn't, then save." : "Fill in what you know. Only the name is needed.")));

  const f = (id, label, el, hint) => h("div", { class: "field" }, h("label", { for: id }, label, hint ? h("span", { class: "hint" }, " · " + hint) : null), el);
  const title = h("input", { id: "f-title", value: d.title || "", placeholder: "e.g. Nan's lemon drizzle", autocomplete: "off" });
  const cat = h("select", { id: "f-cat" }, CATS.map(c => h("option", { value: c, selected: d.category === c }, c)));
  const serves = h("input", { id: "f-serves", type: "number", min: "1", inputmode: "numeric", value: d.serves || "" });
  const time = h("input", { id: "f-time", value: d.time || "", placeholder: "e.g. 1 hr" });
  const calories = h("input", { id: "f-cal", type: "number", min: "1", inputmode: "numeric", value: d.calories || "", placeholder: "Work it out" });
  const notes = h("textarea", { id: "f-notes", rows: "3", placeholder: "e.g. Works with oranges too. Takes 5 min less in the new oven." });
  notes.value = d.notes || "";
  const source = h("input", { id: "f-source", value: d.source || "", placeholder: "A website, a book, or who gave it to you" });

  // Two optional pictures: the finished dish, and the original recipe card/page.
  const pics = {
    photo: { file: d._photoFile || null, current: d.photo || null, label: "Photo of the dish", hint: "optional" },
    cardPhoto: { file: d._cardFile || null, current: d.cardPhoto || null, label: "Photo of the original recipe", hint: "a recipe card or cookbook page" },
  };
  const picField = (name) => {
    const p = pics[name];
    const preview = h("span", {});
    const show = () => {
      const src = p.file ? URL.createObjectURL(p.file) : p.current ? photoUrl(p.current) : null;
      preview.replaceChildren(src ? h("img", { src, alt: "" }) : "");
      btnLabel.lastChild.textContent = src ? "Change photo" : "Add a photo";
      removeBtn.hidden = !src;
    };
    const input = h("input", { id: "f-" + name, type: "file", accept: "image/*", class: "sr" });
    input.onchange = () => { if (input.files[0]) { p.file = input.files[0]; show(); } };
    const btnLabel = h("label", { class: "btn", for: "f-" + name }, icon("i-camera"), h("span", {}, ""));
    const removeBtn = h("button", { class: "btn ghost", type: "button", onclick: () => { p.file = null; p.current = null; input.value = ""; show(); } }, "Remove");
    const row = h("div", { class: "photo-pick" }, preview, btnLabel, removeBtn, input);
    show();
    return h("div", { class: "field" }, h("span", { class: "lbl" }, p.label + " ", h("span", { class: "hint" }, "· " + p.hint)), row);
  };

  /* --- ingredients & method, in parts, variations and extras --- */
  const sectionsBox = h("div", { class: "ed-all" });
  const small = (label, onclick, cls = "") => h("button", { class: "btn small " + cls, type: "button", onclick }, label);
  const area = (id, label, hint, value, rows, placeholder, oninput) => {
    const t = h("textarea", { id, rows, placeholder });
    t.value = value; t.oninput = () => oninput(t.value);
    return f(id, label, t, hint);
  };
  const text = (id, label, value, placeholder, oninput, hint) => {
    const i = h("input", { id, value, placeholder, autocomplete: "off" });
    i.oninput = () => oninput(i.value);
    return f(id, label, i, hint);
  };

  function drawSections() {
    const parts = ed.filter(s => s.kind === "part");
    const subs = ed.filter(s => s.kind === "sub");
    const out = [];

    parts.forEach((s, pi) => {
      const box = h("div", { class: "ed-sec" });
      if (parts.length > 1) box.append(text(`p-${s.id}`, "Part", s.name, pi === 0 ? "e.g. The chicken" : "e.g. The potatoes", v => s.name = v));
      if (s.options.length > 1) {
        box.append(h("div", { class: "chips", role: "group", "aria-label": "Variations" },
          s.options.map((o, i) => h("button", { class: "chip", type: "button", "aria-pressed": String(s.active === i), onclick: () => { s.active = i; drawSections(); } }, o.name || `Version ${i + 1}`)),
          small("+ Add a variation", () => addVariation(s))));
      }
      const o = s.options[s.active] || s.options[0];
      if (s.options.length > 1) box.append(text(`v-${o.id}`, "Variation name", o.name, "e.g. Roast", v => o.name = v));
      box.append(
        area(`i-${o.id}`, "Ingredients", "one per line, amount first", o.ing, "7", "200g self-raising flour\n2 eggs\n1 lemon, zested", v => o.ing = v),
        area(`m-${o.id}`, "Method", "one step per line", o.steps, "7", "Heat the oven to 180°C (160°C fan).\nBeat the butter and sugar until pale.", v => o.steps = v));
      const acts = h("div", { class: "ed-actions" });
      if (s.options.length === 1) acts.append(small("+ Add a variation", () => addVariation(s)));
      if (s.options.length > 1) acts.append(small("Remove this variation", () => { s.options.splice(s.active, 1); s.active = 0; drawSections(); }, "danger"));
      if (parts.length > 1) acts.append(small("Remove this part", () => { ed.splice(ed.indexOf(s), 1); drawSections(); }, "danger"));
      box.append(acts);
      out.push(box);
    });
    out.push(h("div", { class: "ed-actions" },
      small("+ Add another part", () => { ed.splice(parts.length, 0, { id: uid(), kind: "part", name: "", first: false, active: 0, options: [{ id: uid(), name: "", ing: "", steps: "" }] }); drawSections(); }),
      h("span", { class: "hint" }, "A variation is another way to make it. Parts let you swap one bit, like chips or wedges, on its own.")));

    out.push(h("div", { class: "ed-group-head" }, h("h3", {}, "Sauces & extras"),
      h("p", {}, "Separate recipes shown on the same page, like a sauce or a spice rub. They're saved in the book too, so other recipes can use them.")));
    subs.forEach(s => {
      const box = h("div", { class: "ed-sec" });
      box.append(text(`s-${s.id}`, "Name on this page", s.name, "e.g. Sauce", v => s.name = v));
      s.options.forEach((o, i) => {
        const optBox = h("div", { class: "ed-sub-opt" });
        const others = recipes.filter(x => x.id !== editing?.id)
          .sort((a, b) => (b.category === "Sauces & extras") - (a.category === "Sauces & extras") || a.title.localeCompare(b.title));
        const sel = h("select", { id: `r-${o.id}` },
          h("option", { value: "", disabled: true, selected: !o.recipeId }, "Choose a recipe…"),
          h("option", { value: "new", selected: o.recipeId === "new" }, "+ Write a new one"),
          others.map(x => h("option", { value: x.id, selected: o.recipeId === x.id }, x.title)));
        sel.onchange = () => { o.recipeId = sel.value; drawSections(); };
        optBox.append(f(`r-${o.id}`, s.options.length > 1 ? `Choice ${i + 1}` : "Recipe", sel));
        if (o.recipeId === "new") {
          optBox.append(
            text(`nt-${o.id}`, "Its name", o.newTitle, "e.g. Peppercorn sauce", v => o.newTitle = v),
            area(`ni-${o.id}`, "Its ingredients", "one per line", o.newIng, "5", "1 tbsp butter\n1 shallot, chopped", v => o.newIng = v),
            area(`nm-${o.id}`, "Its method", "one step per line", o.newSteps, "5", "Melt the butter and soften the shallot.", v => o.newSteps = v));
        }
        optBox.append(text(`u-${o.id}`, "How much this dish uses", o.uses, "All of it, or e.g. 2 tbsp", v => o.uses = v, "for the calories"));
        if (s.options.length > 1) optBox.append(h("div", { class: "ed-actions" }, small("Remove this choice", () => { s.options.splice(i, 1); drawSections(); }, "danger")));
        box.append(optBox);
      });
      const first = h("input", { id: `first-${s.id}`, type: "checkbox", checked: s.first });
      first.onchange = () => s.first = first.checked;
      box.append(
        h("label", { class: "check", for: `first-${s.id}` }, first, "Show it above the main recipe (make this first)"),
        h("div", { class: "ed-actions" },
          small("+ Add another choice", () => { s.options.push({ id: uid(), recipeId: "", uses: "", newTitle: "", newIng: "", newSteps: "" }); drawSections(); }),
          small("Remove", () => { ed.splice(ed.indexOf(s), 1); drawSections(); }, "danger")));
      out.push(box);
    });
    out.push(h("div", { class: "ed-actions" },
      small("+ Add a sauce or extra recipe", () => { ed.push({ id: uid(), kind: "sub", name: "", first: false, active: 0, options: [{ id: uid(), recipeId: "", uses: "", newTitle: "", newIng: "", newSteps: "" }] }); drawSections(); })));
    sectionsBox.replaceChildren(...out);
  }
  function addVariation(s) {
    const from = s.options[s.active] || s.options[0];
    s.options.push({ id: uid(), name: "", ing: from.ing, steps: from.steps });
    if (s.options.length === 2 && !from.name) from.name = "Original";
    s.active = s.options.length - 1;
    drawSections();
    document.getElementById(`v-${s.options[s.active].id}`)?.focus();
  }
  drawSections();

  const fromCard = isNew && d._cardFile;
  const box = h("div", { class: "box" },
    fromCard ? picField("cardPhoto") : null,
    f("f-title", "Recipe name", title),
    h("div", { class: "row" }, f("f-cat", "Type", cat), f("f-serves", "Serves", serves), f("f-time", "Time", time), f("f-cal", "Calories", calories)),
    h("p", { style: "margin:-6px 0 0;color:var(--muted);font-size:13px" }, "Calories are per serving. Leave it blank and they're worked out from the ingredients, shown with ≈."),
    fromCard ? h("p", { style: "margin:0;color:var(--muted);font-size:14px" }, "The photo is saved with the recipe, so the rest is optional. Type the ingredients and method below if you'd like them searchable.") : null,
    sectionsBox,
    f("f-notes", "Notes", notes, "tips, swaps, reminders"),
    f("f-source", "Where it's from", source),
    picField("photo"),
    fromCard ? null : picField("cardPhoto"));

  const msg = h("span", { class: "msg" });
  const saveBtn = h("button", { class: "btn primary", type: "submit" }, editing ? "Save changes" : "Save recipe");
  box.append(h("div", { class: "form-actions" }, msg, h("button", { class: "btn ghost", type: "button", onclick: () => history.back() }, "Cancel"), saveBtn));

  const form = h("form", {}, box);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fail = (t, focusId) => { msg.className = "msg err"; msg.textContent = t; if (focusId) document.getElementById(focusId)?.focus(); };
    if (!title.value.trim()) return fail("Give the recipe a name first.", "f-title");
    for (const s of ed.filter(x => x.kind === "sub")) for (const o of s.options) {
      if (o.recipeId === "new" && !o.newTitle.trim()) return fail("Give the new sauce or extra a name.", `nt-${o.id}`);
    }
    saveBtn.disabled = true; msg.className = "msg"; msg.textContent = "Saving…";
    try {
      // New sauces and extras become recipes of their own first, so this one can point at them.
      for (const s of ed.filter(x => x.kind === "sub")) for (const o of s.options) {
        if (o.recipeId !== "new") continue;
        const sub = await saveRecipe({ id: crypto.randomUUID(), title: o.newTitle.trim(), category: "Sauces & extras", ingredients: toLines(o.newIng), steps: toLines(o.newSteps) });
        o.recipeId = sub.id;
      }
      const sections = ed.map(s => s.kind === "sub"
        ? { id: s.id, kind: "sub", name: s.name.trim(), first: s.first, options: s.options.filter(o => o.recipeId).map(o => ({ id: o.id, recipeId: o.recipeId, uses: o.uses.trim() })) }
        : { id: s.id, kind: "part", name: s.name.trim(), options: s.options.map((o, i) => ({ id: o.id, name: o.name.trim() || (s.options.length > 1 ? `Version ${i + 1}` : ""), ingredients: toLines(o.ing), steps: toLines(o.steps) })) })
        .filter(s => s.options.length);
      const firstPart = sections.find(s => s.kind === "part")?.options[0];
      const simple = sections.length === 1 && sections[0].kind === "part" && sections[0].options.length === 1;

      const ids = {};
      for (const name of ["photo", "cardPhoto"]) {
        const p = pics[name];
        if (p.file) { msg.textContent = "Uploading the photo…"; ids[name] = await uploadPhoto(p.file); }
        else ids[name] = p.current;
      }
      const body = {
        id: editing ? editing.id : crypto.randomUUID(),
        title: title.value.trim(), category: cat.value,
        serves: Number(serves.value) > 0 ? Math.round(Number(serves.value)) : null,
        calories: Number(calories.value) > 0 ? Math.round(Number(calories.value)) : null,
        time: time.value.trim(),
        // The first version's lists stay at the top level too, for anything that reads a plain recipe.
        ingredients: firstPart?.ingredients || [], steps: firstPart?.steps || [],
        sections: simple ? [] : sections,
        notes: notes.value.trim(), source: source.value.trim(),
        favourite: editing?.favourite || false,
        example: editing?.example || false,
        photo: ids.photo, cardPhoto: ids.cardPhoto,
      };
      const saved = await saveRecipe(body);
      if (editing) for (const name of ["photo", "cardPhoto"]) if (editing[name] && editing[name] !== saved[name]) dropPhoto(editing[name]);
      draft = null;
      ui.openId = null;
      history.replaceState("", "", location.pathname + location.search + "#r-" + saved.id);
      route();
    } catch (err) {
      saveBtn.disabled = false;
      fail(err?.code === "wrong_key" ? "The kitchen code needs entering again. Your recipe is still here."
        : err?.code === "too_large" ? "That photo is too big. Try a different one."
        : err?.code === "not_image" ? "That photo's format isn't supported. Try a JPEG or PNG."
        : "It didn't save. Check the internet connection and press Save again.");
      if (err?.code === "wrong_key") {
        draft = { ...d, _for: editing?.id, _ed: ed, title: title.value, category: cat.value, serves: serves.value, time: time.value, calories: calories.value,
          notes: notes.value, source: source.value, _cardFile: pics.cardPhoto.file, _photoFile: pics.photo.file };
        ui.after = location.hash; requireKey(() => {});
      }
    }
  });
  wrap.append(form);
  app.append(wrap);
  if (isNew && !d.title) title.focus();
}

addBtn.onclick = () => nav("#add");

/* ---------- start up ---------- */
try { recipes = JSON.parse(store.get("recipesCache") || "[]"); } catch { recipes = []; }
route();
loadRecipes();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && (ui.view === "list" || ui.view === "recipe")) loadRecipes(); });
</script>
</body>
</html>
